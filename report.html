<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Evaluation Report</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --subtext: #666666;
            --primary: #000000;
            --border: #eeeeee;
            --accent: #f9f9f9;
            --success-bg: #ecfdf5;
            --success-text: #059669;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px;
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 48px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .timestamp {
            font-size: 14px;
            color: var(--subtext);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 48px;
        }

        .stat-card {
            padding: 24px;
            background: var(--accent);
            border-radius: 12px;
        }

        .stat-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--subtext);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            display: block;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
        }

        th {
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: var(--subtext);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
        }

        .grade-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
            background: var(--primary);
            color: white;
        }

        .status-badge {
            font-size: 12px;
        }

        .button {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .button:hover {
            opacity: 0.9;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 48px 0 16px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Evaluation Summary</h1>
                <div class="timestamp" id="reportDate"></div>
            </div>
            <button id="downloadCsv" class="button">Download CSV</button>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Total Processed</span>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <span class="stat-label">Exceptions Applied</span>
                <div class="stat-value" id="exceptionCount">0</div>
            </div>
            <div class="stat-card">
                <span class="stat-label">Completion Time</span>
                <div class="stat-value" id="completionTime">-</div>
            </div>
        </div>

        <div id="reportSections">
            <!-- Sections will be injected here -->
        </div>
    </div>
    <script src="report.js"></script>
</body>
</html>
