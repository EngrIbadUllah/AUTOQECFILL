<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AUTOQECFILL</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #1a1a1a;
        --subtext: #666666;
        --primary: #000000;
        --border: #eeeeee;
        --accent: #f5f5f5;
        --success: #10b981;
        --error: #ef4444;
      }

      body {
        width: 380px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
        line-height: 1.5;
      }

      header {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 24px;
      }

      .logo {
        height: 70px;
        width: auto;
        display: block;
      }

      #statusDot {
        position: absolute;
        right: 0;
      }

      .section {
        margin-bottom: 24px;
      }

      .label {
        font-size: 12px;
        font-weight: 500;
        color: var(--subtext);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
        display: block;
      }

      select,
      input {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 14px;
        background: var(--accent);
        color: var(--text);
        outline: none;
        transition: border-color 0.2s;
      }

      select:focus {
        border-color: var(--primary);
      }

      .button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .button-primary {
        background: var(--primary);
        color: white;
      }

      .button-secondary {
        background: var(--accent);
        color: var(--text);
        margin-top: 8px;
      }

      .button:hover {
        opacity: 0.9;
      }

      .exception-row {
        display: grid;
        grid-template-columns: 80px 1fr 50px 30px;
        gap: 8px;
        margin-bottom: 8px;
        align-items: center;
      }

      .remove-btn {
        background: none;
        border: none;
        color: var(--subtext);
        font-size: 18px;
        cursor: pointer;
        padding: 0;
      }

      #progressContainer {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
      }

      .error-text {
        color: var(--error);
        font-size: 12px;
        margin-top: 6px;
      }

      .footer {
        text-align: center;
        font-size: 12px;
        color: var(--subtext);
        margin-top: 16px;
      }

      .footer a {
        color: inherit;
        text-decoration: none;
        font-weight: 600;
      }

      .footer a:hover {
        text-decoration: underline;
      }

      .progress-bar-bg {
        height: 4px;
        background: var(--accent);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 12px;
      }

      #progressBar {
        height: 100%;
        background: var(--primary);
        width: 0%;
        transition: width 0.3s ease;
      }

      .progress-info {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--subtext);
        margin-bottom: 4px;
      }

      #progressDetail {
        font-size: 11px;
        color: var(--subtext);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #showReportBtn {
        background: var(--success);
        color: white;
        margin-top: 12px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="assets/logo.png" alt="AUTOQECFILL" class="logo" />
      <div
        id="statusDot"
        style="
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: var(--border);
        "
      ></div>
    </header>

    <div class="section">
      <span class="label">Default Grade</span>
      <select id="grade">
        <option value="1">Grade A</option>
        <option value="2" selected>Grade B</option>
        <option value="3">Grade C</option>
        <option value="4">Grade D</option>
      </select>
    </div>

    <div class="section">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 8px;
        "
      >
        <span class="label" style="margin: 0">Exceptions</span>
        <button
          id="syncAllForms"
          style="
            background: none;
            border: none;
            color: var(--subtext);
            font-size: 11px;
            cursor: pointer;
            text-decoration: underline;
          "
        >
          Sync Portal
        </button>
      </div>
      <div id="exceptionsList"></div>
      <div id="exceptionsMessage" class="error-text hidden"></div>
      <button
        id="addException"
        class="button button-secondary"
        style="font-size: 12px; padding: 8px"
      >
        + Add Exception
      </button>
    </div>

    <div class="section">
      <button id="startAutoFill" class="button button-primary">
        Start Automation
      </button>
    </div>

    <div id="progressContainer" class="hidden">
      <div class="progress-info">
        <span id="progressLabel">Progress</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressBar"></div>
      </div>
      <div id="progressDetail">Initializing...</div>
      <button id="showReportBtn" class="button hidden">
        View Final Report
      </button>
    </div>

    <div class="footer">
      Developed with ❤️ by
      <a
        href="http://github.com/ENgrIbadUllah"
        target="_blank"
        rel="noopener noreferrer"
        >5h3rd1l</a
      >
    </div>

    <script src="popup.js"></script>
  </body>
</html>
